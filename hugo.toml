baseURL = "/"
languageCode = "en-us"
title = ""

# Theme Config (set to your actual theme folder name)
theme = "hugo-saasify-theme"

# Enable syntax highlighting
pygmentsCodeFences = true
pygmentsUseClasses = true

# Enable emoji support
enableEmoji = true

# Enable Git info for lastmod
enableGitInfo = false

# Enable taxonomies
[taxonomies]
  category = 'categories'
  tag = 'tags'

# Pagination
paginate = 9
paginatePath = "page"

[params]
  description = "Simple, trustworthy guidance to plan, track, and grow — made for Indian families."
  author = "VittSeva"
  logo = "images/vs/logo-vittseva-small.svg"
  # googleAnalytics = "G-XXXXXXXXXX"
  disclaimer = "VittSeva is a financial advisory service. All investments are subject to market risks. Past performance does not guarantee future results. Please read all scheme related documents carefully before investing. Consult with our certified financial advisors for recommendations tailored to your specific financial situation."

  # Global CTA Configuration
  [params.cta]
    enable = true
    title = "Ready to Transform Your Financial Future?"
    description = "Join our family of satisfied clients and experience the VittSeva difference. Get personalized financial advice that's simple, optimal, and tailored to your unique needs."
    gradient_from = "#2563eb"  # Indigo-600
    gradient_to = "#22c55e"    # Green-500 (keeps your blue→green look)
    gradient_angle = 30
    [params.cta.primary_button]
      text = "Book a free consultation"
      url = "/contact"
    [params.cta.secondary_button]
      text = "Explore Services"
      url = "/service"

  # Social Media Links
  [params.social]
	phone = "+91-9876543210"
    linkedin = "https://www.linkedin.com/company/vittseva"
    facebook = "https://www.facebook.com/vittseva"
    twitter = "https://twitter.com/vittseva"
    email = "info@vittseva.com"

  # Footer Configuration (column headings)
  [params.footer]
    column_1_title = "Services"
    column_2_title = "Company"
    column_3_title = "Legal"

  [params.header]
    # Header background and border styles (optional)
    background = "bg-white/80 backdrop-blur-sm"
    border = "border-b border-gray-100"

    # Logo configuration
    [params.header.logo]
      src = "images/vs/logo-vittseva-small.svg"

    # Menu configuration
    [params.header.menu]
      spacing = "space-x-8"

      # Dropdown menu configuration
      [params.header.menu.dropdown]
        width = "w-72"
        container_padding = "py-6"
        item_padding = "px-8 py-3"
        background = "bg-white"
        border = "border border-gray-100"
        shadow = "shadow-xl"
        radius = "rounded-lg"
        text_color = "text-gray-700"
        hover_background = "hover:bg-gray-50"
        text_size = "text-sm"

    # Header buttons (optional)
    [params.header.buttons]
      [params.header.buttons.getStarted]
        text = "Book consultation"
        url = "/contact"

  # Blog configuration
  [params.blog]
    enable = true
    title = "Latest Articles"
    subtitle = "Personal finance insights for Indian families"

    [params.blog.cta]
      enable = true

    [params.blog.sidebar.recent]
      enable = true
      title = "Recent Articles"
      count = 5

    [params.blog.sidebar.categories]
      enable = true
      title = "Categories"

    [params.blog.sidebar.tags]
      enable = true
      title = "Popular Tags"
      count = 20

    [params.blog.sidebar.subscribe]
      enable = false
      title = "Subscribe to Newsletter"
      description = "Get the latest posts delivered to your inbox"
      action = "https://formspree.io/f/your-form-id"
      emailName = "email"
      buttonText = "Subscribe"
      placeholder = "Enter your email"
      disclaimer = "We respect your privacy. Unsubscribe anytime."

[module]
  [module.hugoVersion]
    extended = true
    min = "0.80.0"

[build]
  writeStats = true

[build.buildStats]
  enable = true

[security.funcs]
  getenv = ['^HUGO_', '^CI$']

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    codeFences = true
    guessSyntax = true
    lineNumbersInTable = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

# Navigation Menu
[menu]
  # Main: Services dropdown, Pricing, Blog, Company dropdown
  [[menu.main]]
    name = "Services"
    weight = 1
    [menu.main.params]
      has_submenu = true
      submenu = [
      { name = "Accounting & Tax Filing", url = "service/accounting-tax/" },
        { name = "Insurance", url = "service/insurance/" },
        { name = "Claim Settlement", url = "service/claim-settlement/" },
        { name = "Loans", url = "service/loans/" },
        { name = "Investments", url = "service/investments/" },
        { name = "Funding & Finance", url = "service/funding-finance/" },
        { name = "Business Banking", url = "service/business-banking/" },
        { name = "NRI Services", url = "service/nri-services/" },
        { name = "Corporate Law Advisory", url = "service/corporate-law/" }
      ]

  [[menu.main]]
    name = "About Us"
    url = "/about"
    weight = 2

  [[menu.main]]
    name = "Blog"
    url = "/blog"
    weight = 3

  [[menu.main]]
    name = "Contact"
    url = "/contact"
    weight = 4

  # Footer Column 1 (Services)
  [[menu.footer_column_1]]
    name = "Accounting and Tax"
    url = "/services#vsat"
    weight = 1
  [[menu.footer_column_1]]
    name = "Insurance Guidance"
    url = "/services#vcin"
    weight = 2
  [[menu.footer_column_1]]
    name = "Claims Support"
    url = "/services#vscs"
    weight = 3

  # Footer Column 2 (Company)
  [[menu.footer_column_2]]
    name = "Blog"
    url = "/blog"
    weight = 1
  [[menu.footer_column_2]]
    name = "About Us"
    url = "/company"
    weight = 2
  [[menu.footer_column_2]]
    name = "Contact"
    url = "/contact"
    weight = 3

  # Footer Column 3 (Legal)
  [[menu.footer_column_3]]
    name = "License"
    url = "/license"
    weight = 1
  [[menu.footer_column_3]]
    name = "Privacy Policy"
    url = "/privacy"
    weight = 2